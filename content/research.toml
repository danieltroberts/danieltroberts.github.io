[[working_papers]]
title = "Local Dependence: Evidence from the Rollback of Dodd-Frank"
featured = true
topics = ["Finance", "Regulation"]
primary_url = ""
abstract = """
A number of important US banks secured looser risk oversight when Congress rolled back the Dodd-Frank Act in 2018. Existing theories suggest that large US banks wield instrumental power to secure deregulation, but this rollback benefited smaller banks. I explain this with a theory of local dependence, arguing that geographically concentrated and represented firms use local disinvestment threats to influence policy. I hypothesize that local dependence on banks predicts representatives' votes for the rollback, and test this by linking district-level local dependence on banks, banks' instrumental influence, and roll-call votes. Results show that credible local threats to small banks' lending and regional banks' high-risk lending predicts rollback support, while instrumental influence only does when it accompanies prospective threats to local headquarters employment at regional banks. Qualitative evidence provides further support. To conclude, I outline directions for future research, interpret these American results in comparative perspective, and suggest implications for the politics of international risk regulation.
"""

[[publications]]
title = "Liquidity Regulations, Bank Lending and Fire-Sale Risk"
authors = "Daniel T. Roberts, Asani Sarkar, and Or Shachar"
year = "2023"
venue = "Journal of Banking & Finance"
details = "156: 107007"
featured = true
topics = ["Finance", "Regulation"]
primary_url = "https://www.sciencedirect.com/science/article/abs/pii/S037842662300198X"
abstract = """
We examine whether U.S. banks subject to the Liquidity Coverage Ratio (LCR) reduce lending (an unintended consequence) and/or become more resilient to liquidity shocks, as intended by regulators. We find that LCR banks tighten lending standards, and reduce liquidity creation that occurs mainly through lower lending relative to non-LCR banks. However, covered banks also contribute less to fire-sale externalities relative to exempt banks. For LCR banks, we estimate that the total after-tax benefits of reduced fire-sale risk (net of the costs associated with foregone lending) exceed $50 billion from 2013Q2 to 2017, mostly accruing to the largest LCR banks. Non-LCR regulations enacted during our sample period cannot fully account for these findings. For the banking sector as a whole, lending migrates to smaller, non-LCR banks so that lending shares increase but fire-sale risk does not decrease. Our results highlight the trade-off between liquidity creation and resiliency arising from liquidity regulations that underlie the debate on whether the LCR should be extended following the banking crisis of March 2023.
"""
